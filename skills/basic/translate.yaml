# ── 技能文件规范 ──────────────────────────────────────────────
# 所有字段说明见 CONTRIBUTING.md

name: translate
description: 将文本翻译为指定语言，保持原文风格
version: "1.0.0"
author: onion-ai
tags:
  - 语言
  - 翻译
  - basic
category: basic

params:
  - name: input
    description: 待翻译文本
    required: true
    default: ""
  - name: lang
    description: 目标语言
    required: false
    default: "英文"

template: |
  请将以下文本翻译为{lang}，保持原文风格和格式：

  {input}

# 可选：使用示例（用于 hub show 预览）
examples:
  - params:
      input: "Hello, World!"
      lang: "中文"
    expected: "你好，世界！"